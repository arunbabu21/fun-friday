<div class="game-container">
  <h1>Find the celebrity</h1>
  <div class="image-wrapper">
    @if (currentImage) {
      <img [src]="'./assets/' + currentImage + '.jpg'" alt="Game Image" class="background-image" />
    } @else {
      <div class="no-image-placeholder">Select an image to start</div>
    }
    <div class="number-grid">
        @for (row of [0, 1, 2, 3]; track row) {
          <div class="grid-row">
            @for (col of [0, 1, 2, 3]; track col) {
              <div class="grid-cell" 
                   (click)="revealCell(row * 4 + col + 1)"
                   [class.revealed]="revealedCells.includes(row * 4 + col + 1)">
                @if (!revealedCells.includes(row * 4 + col + 1)) {
                  {{ row * 4 + col + 1 }}
                }
              </div>
            }
          </div>
        }
      </div>
  </div>  
  <div class="button-group">
    <button (click)="resetGame()" class="reset-btn">Reset Game</button>
    <button (click)="showFullImage()" class="show-image-btn">Show Image</button>
  </div>
  <button [routerLink]="'/'" class="back-btn">← Back to Home</button>
  
  <div class="image-buttons">
    @for (i of [1, 2, 3, 4, 5, 6]; track i) {
      <button (click)="selectImage(i)" 
              class="image-btn"
              [class.active]="currentImage === i">{{ i }}</button>
    }
  </div>
</div>
